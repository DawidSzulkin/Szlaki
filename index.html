<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MSB Planner - Mały Szlak Beskidzki</title>
  <link rel="icon" type="image/svg+xml" href="/Szlaki/favicon.svg" />
  <link rel="apple-touch-icon" href="/Szlaki/favicon.svg" />
  <script type="module" crossorigin src="/Szlaki/assets/index-BhL44r-Z.js"></script>
  <link rel="stylesheet" crossorigin href="/Szlaki/assets/index-CN0YCCRX.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="collapsed">
      <button id="sidebar-toggle" aria-label="Przełącz panel sterowania">
        <span class="handle-bar"></span>
        <div class="sidebar-header-title">
          <h1>Mały Szlak Beskidzki</h1>
          <span class="toggle-icon">▲</span>
        </div>
      </button>

      <div class="sidebar-content">
        <p class="subtitle">137 km • Bielsko-Biała → Luboń Wielki</p>

        <div class="control-section">
          <label class="section-title">Profil trasy:</label>
          <div class="profile-selector">
            <button class="profile-btn active" data-profile="standard">Schroniska (Standard)</button>
            <button class="profile-btn" data-profile="wild">Namiot / Dziki biwak</button>
          </div>
        </div>

        <div class="control-section">
          <label class="section-title">Liczba dni:</label>
          <div class="days-selector">
            <button class="day-btn" data-days="3">3 dni</button>
            <button class="day-btn" data-days="4">4 dni</button>
            <button class="day-btn active" data-days="5">5 dni</button>
            <button class="day-btn" data-days="6">6 dni</button>
          </div>
        </div>

        <div class="control-section">
          <label class="section-title">Warstwy i punkty:</label>
          <!-- Tu JS dynamicznie wstrzyknie checkboxy (brak dublowania DOM!) -->
          <div class="layer-toggles"></div>
        </div>

        <hr />

        <div class="control-section">
          <label class="section-title">Podsumowanie etapów:</label>
          <div id="stages-summary"></div>
        </div>
      </div>
    </aside>

    <main id="map-container">
      <div id="map"></div>
    </main>
  </div>

</body>
</html>
