<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Szlaki Polski - MSB Planner</title>
    <script type="module" crossorigin src="/Szlaki/assets/index-DZoGedTH.js"></script>
    <link rel="stylesheet" crossorigin href="/Szlaki/assets/index-C2cqiNP0.css">
  </head>
  <body>
    <div id="controls">
      <h2>Mały Szlak Beskidzki</h2>
      <p>Wybierz czas przejścia (137 km):</p>
      
      <div class="day-selector">
        <button class="day-btn" data-days="4">4 dni (Hardcore)</button>
        <button class="day-btn active" data-days="5">5 dni (Optymalnie)</button>
        <button class="day-btn" data-days="6">6 dni (Rekreacyjnie)</button>
      </div>

      <div class="filter-section">
        <p><strong>Warstwy na mapie:</strong></p>
        <label><input type="checkbox" id="toggle-main-pois" checked /> Punkty etapowe (baza)</label>
        <label><input type="checkbox" id="toggle-water" checked /> Źródła wody (OSM)</label>
        <label><input type="checkbox" id="toggle-shelters" checked /> Wiaty i schrony (OSM)</label>
      </div>

      <div id="stages-summary"></div>
    </div>

    <div id="map"></div>
  </body>
</html>
